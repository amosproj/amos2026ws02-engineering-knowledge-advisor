repos:
  - repo: local
    hooks:
      - id: update-sbom
        name: Update software bill of materials
        entry: python3 scripts/generate_sbom.py --staged
        language: system
        pass_filenames: false
        files: ^(apps/api/(pyproject\.toml|uv\.lock)|apps/web/(package\.json|package-lock\.json)|scripts/generate_sbom\.py|Documentation/sbom/.*\.json|\.pre-commit-config\.yaml)$

      - id: check-tool-versions
        name: Check uv, npm and Node versions are in sync
        entry: python3 scripts/check_tool_versions.py
        language: system
        pass_filenames: false
        files: ^(apps/api/(pyproject\.toml|Dockerfile)|apps/web/(package\.json|Dockerfile)|\.github/workflows/sbom-check\.yml|scripts/check_tool_versions\.py)$

      - id: ruff-check
        name: ruff check
        entry: uv run --project apps/api/ ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/api/ ruff format
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: uv run --project apps/api pyright --project apps/api
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest
        name: pytest
        entry: uv run --directory apps/api pytest -q
        language: system
        pass_filenames: false
        types_or: [python]
