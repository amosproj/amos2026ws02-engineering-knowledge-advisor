repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project apps/api/ ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/api/ ruff format
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: uv run --project apps/api pyright --project apps/api
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest
        name: pytest
        entry: uv run --directory apps/api pytest -q
        language: system
        pass_filenames: false
        types_or: [python]
