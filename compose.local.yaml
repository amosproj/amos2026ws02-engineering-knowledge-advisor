# Local development only: exposes Postgres and MinIO on this machine.
# Enabled by COMPOSE_FILE=compose.yaml:compose.local.yaml in the .env (see .env.example).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  minio:
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # console
