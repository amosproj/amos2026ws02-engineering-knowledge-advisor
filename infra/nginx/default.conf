
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only presigned POST uploads may reach object storage
    location = /storage/${S3_BUCKET} {
        limit_except POST {
            deny all;
        }
        if ($is_args) {
            return 404;
        }
        proxy_pass http://minio:9000/${S3_BUCKET};
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # Presigned downloads of the 3D models only. The signature covers the host, so MinIO gets the host
    # the API signs for (API_S3_ENDPOINT_URL)
    location ~ ^/storage/${S3_BUCKET}/files/[^/]+/model\.glb$ {
        limit_except GET {
            deny all;
        }
        rewrite ^/storage(/.*)$ $1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        # the link carries the credentials; S3 refuses a second one, e.g. the app's Authorization header
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /storage {
        return 404;
    }

    location /storage/ {
        return 404;
    }

    # Support React client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}