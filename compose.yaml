services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${APP_ENV:-prod}
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      # Only used by the Vite dev server (APP_ENV=dev): where it proxies /api
      WEB_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Hot reload, only active with `docker compose up --watch` (APP_ENV=dev)
    develop:
      watch:
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - node_modules/
            - dist/
            - package.json
            - package-lock.json

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
      target: ${APP_ENV:-prod}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/pyproject.toml
        - action: rebuild
          path: ./apps/api/uv.lock
        - action: sync
          path: ./apps/api/src
          target: /app/src
          ignore:
            - __pycache__/

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
