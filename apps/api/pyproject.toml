[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jost Nadwornik", email = "nadwornik@campus.tu-berlin.de" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.116",
    "fastapi>=0.156.8",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Matches the Dockerfile and CI; uv export --format cyclonedx1.5 needs >=0.13.
required-version = "==0.13.4"
