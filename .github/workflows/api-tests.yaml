name: API Tests

on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-tests.yaml"]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        # includes contrib modules with pg_trgm
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # tests will drop and recreate every ograg_* table, do **NOT** set this to anything but a temp db
      API_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scratch

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          working-directory: apps/api
          enable-cache: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff check --output-format github

      - name: Ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff format --check --diff

      - name: Pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync pyright

      - name: Pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          set -o pipefail
          uv run --no-sync pytest -v -rs | tee pytest.log
          # API_TEST_DATABASE_URL is set, skipped test means Postgres tests did not run
          if grep -q SKIPPED pytest.log; then
            echo "::error:: Postgres tests must run but were skipped by pytest"
            exit 1
          fi

      - name: Alembic migrations
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          API_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/migrate
          API_OGRAG_ONTOLOGY_PATH: ${{ github.workspace }}/apps/api/ontology_v0.jsonld
        run: |
          psql -d postgres -c "CREATE DATABASE migrate"
          uv run --no-sync alembic upgrade head
          # fails if tables.py and migrations differ
          uv run --no-sync alembic check
