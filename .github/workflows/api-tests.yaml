name: API Tests

on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-tests.yaml"]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: apps/api
          enable-cache: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff check --output-format github

      - name: Ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff format --check --diff

      - name: Pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync pyright

      - name: Pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync pytest -v
